<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRENDTEES Studio — Streetwear Catalog Drop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght=500;600;700&family=Inter:wght=400;500;600;700&display=swap');

  :root{
    --void:#06060a;
    --panel:#100f17;
    --panel-2:#171622;
    --line: rgba(168,85,247,0.18);
    --violet:#a855f7;
    --magenta:#ec4dd8;
    --cyan:#22d3ee;
    --ice:#eef1ff;
    --mist:#9090a6;
    --danger:#ff5470;
    --go:#34e0a1;
    --grad-drip: linear-gradient(95deg, var(--violet) 0%, var(--magenta) 45%, var(--cyan) 100%);
    --radius: 14px;
    --radius-sm: 8px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(168,85,247,0.12), transparent 60%), var(--void);
    color:var(--ice); font-family:'Inter', sans-serif; padding-bottom: 60px;
  }
  h1,h2,h3,.display{font-family:'Rajdhani', sans-serif; font-weight:700;}
  button{cursor:pointer; font-family:inherit;}

  .navbar{height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:rgba(10,10,16,0.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100;}
  .logo{font-size:24px; background:var(--grad-drip); -webkit-background-clip:text; background-clip:text; color:transparent;}
  
  .user-badge{font-size:13px; font-weight:600; background:var(--panel-2); border:1px solid var(--line); padding:6px 14px; border-radius:20px; color:var(--cyan);}

  .auth-section{max-width:400px; margin:40px auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:24px;}
  .auth-tabs{display:flex; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .auth-tab{flex:1; padding:10px; background:transparent; border:none; color:var(--mist); font-weight:700; text-align:center;}
  .auth-tab.active{color:var(--ice); border-bottom:2px solid var(--cyan);}

  .catalog-container{display:none;}
  .catalog-container.active{display:block;}

  .hero{text-align:center; padding:40px 20px;}
  .hero h1{font-size:44px; margin-bottom:8px; letter-spacing:1px;}
  .hero p{color:var(--mist); font-size:14px;}

  .catalog{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:28px; padding:0 24px; max-width:1200px; margin:0 auto;}
  .prod-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:transform 0.2s;}
  .prod-card:hover{transform:translateY(-4px);}
  
  .img-container{width:100%; height:320px; background:var(--void); overflow:hidden; position:relative; cursor:zoom-in;}
  .img-container img{width:100%; height:100%; object-fit:cover;}
  .img-overlay-tag{position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:4px; font-size:11px; color:var(--cyan);}

  .prod-info{padding:20px;}
  .prod-title{font-size:19px; margin-bottom:6px; font-weight:700;}
  .prod-desc{font-size:13px; color:var(--mist); margin-bottom:14px; min-height:38px; line-height:1.4;}
  .prod-meta{display:flex; justify-content:space-between; align-items:center;}
  .price{font-size:22px; color:var(--cyan); font-family:'Rajdhani',sans-serif; font-weight:700;}
  
  .btn{border:none; border-radius:var(--radius-sm); font-weight:600; font-size:14px; padding:10px 18px;}
  .btn-action{background:var(--grad-drip); color:#08060d;}

  .modal{display:none; position:fixed; inset:0; background:rgba(5,5,8,0.85); backdrop-filter:blur(8px); z-index:200; align-items:center; justify-content:center; padding:20px;}
  .modal.active{display:flex;}
  .modal-content{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); max-width:500px; width:100%; overflow:hidden; position:relative;}
  .modal-img{width:100%; max-height:440px; object-fit:contain; background:var(--void); display:block;}
  .modal-close{position:absolute; top:12px; right:12px; background:var(--void); border:1px solid var(--line); color:var(--ice); width:32px; height:32px; border-radius:50%; font-weight:700;}

  #checkoutSection{max-width:540px; margin:50px auto 0; padding:0 20px; display:none;}
  #checkoutSection.active{display:block; animation:slideUp 0.35s ease;}
  @keyframes slideUp{from{transform:translateY(15px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; color:var(--mist); margin-bottom:6px; letter-spacing:0.5px;}
  .field input, .field textarea{width:100%; background:var(--void); border:1px solid var(--line); border-radius:var(--radius-sm); color:var(--ice); padding:12px; font-family:inherit; outline:none;}
  .field textarea{resize:vertical; min-height:75px;}
  .field input:focus, .field textarea:focus{border-color:var(--cyan);}

  .toast-wrap{position:fixed; bottom:24px; right:24px; z-index:999;}
  .toast{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--go); border-radius:10px; padding:13px 18px; font-size:13px; color:var(--ice); box-shadow:0 10px 30px rgba(0,0,0,0.5);}
  .toast.err{border-left-color:var(--danger);}
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">TRENDTEES <span style="font-family:'Rajdhani'; font-weight:700;">STUDIO</span></div>
  <div id="navUserWrapper"></div>
</nav>

<section class="auth-section" id="customerAuthPortal">
  <div class="auth-tabs">
    <button class="auth-tab active" id="tabCustLogin" onclick="toggleAuthTab('login')">Sign In</button>
    <button class="auth-tab" id="tabCustSignup" onclick="toggleAuthTab('signup')">Register</button>
  </div>
  
  <div id="custLoginForm">
    <div class="field"><label>Mobile Number</label><input type="tel" id="cLoginMobile" placeholder="10-digit number" maxlength="10"></div>
    <div class="field"><label>Password</label><input type="password" id="cLoginPassword" placeholder="••••••"></div>
    <button class="btn btn-primary btn-action" style="width:100%; padding:12px;" onclick="executeCustomerLogin()">Access Shop Drops</button>
  </div>

  <div id="custSignupForm" style="display:none;">
    <div class="field"><label>Full Name</label><input type="text" id="cSignupName" placeholder="Your Name"></div>
    <div class="field"><label>Mobile Number</label><input type="tel" id="cSignupMobile" placeholder="10-digit number" maxlength="10"></div>
    <div class="field"><label>Password</label><input type="password" id="cSignupPassword" placeholder="Min 6 characters"></div>
    <button class="btn btn-primary btn-action" style="width:100%; padding:12px;" onclick="executeCustomerSignup()">Create Account</button>
  </div>
</section>

<div class="catalog-container" id="shopCatalogContainer">
  <section class="hero">
    <h1>DEHRADUN EXCLUSIVE DROPS</h1>
    <p style="color:var(--cyan); font-weight:600; font-size:13px;">🔍 Click apparel layouts to zoom. Press Buy Drop to deploy instant checkout.</p>
  </section>

  <main class="catalog" id="catalogView"></main>

  <section id="checkoutSection">
    <div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:24px;">
      <h2 style="margin-bottom:16px; font-family:'Rajdhani'; letter-spacing:0.5px;">SECURE LOCAL CHECKOUT</h2>
      
      <div class="field"><label>Customer Identity</label><input type="text" id="custName" readonly style="opacity:0.6;"></div>
      <div class="field"><label>Contact Channel</label><input type="tel" id="custMobile" readonly style="opacity:0.6;"></div>
      
      <div class="field">
        <label>Delivery Address / Google Maps Location Link</label>
        <textarea id="custAddress" placeholder="Type hostel room number, campus area, or paste the Google Maps pin drop link 📍"></textarea>
      </div>
      
      <div style="margin-top:10px; padding:10px; background:rgba(34,211,238,0.05); border:1px solid rgba(34,211,238,0.2); border-radius:6px; font-size:12px; margin-bottom:14px;">
        Target Product Drop ID: <b id="targetProdId" style="color:var(--cyan);">None</b>
      </div>
      <button class="btn btn-primary btn-action" style="width:100%; padding:14px;" onclick="submitOrder()">Confirm Delivery Drop</button>
    </div>
  </section>
</div>

<div class="modal" id="imageModal" onclick="closeImgViewer()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeImgViewer()">✕</button>
    <img src="" id="modalTargetImg" class="modal-img">
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
  const BACKEND_API = "https://trendtees-backend-api.onrender.com/api";
  let activeProductId = "";
  let loggedInCustomer = null;

  function toast(msg, type){
    const wrap = document.getElementById('toastWrap'); wrap.innerHTML = "";
    const el = document.createElement('div'); el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg; wrap.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  window.toggleAuthTab = function(mode) {
    document.getElementById('tabCustLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabCustSignup').classList.toggle('active', mode === 'signup');
    document.getElementById('custLoginForm').style.display = mode === 'login' ? '' : 'none';
    document.getElementById('custSignupForm').style.display = mode === 'signup' ? '' : 'none';
  };

  /* ==================== AUTH CUSTOMER EXECUTIONS ==================== */
  window.executeCustomerLogin = async function() {
    const mobile = document.getElementById('cLoginMobile').value.trim();
    const password = document.getElementById('cLoginPassword').value;
    if(!mobile || !password) { toast('Fill metrics completely.', 'err'); return; }

    try {
      const res = await fetch(`${BACKEND_API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mobile, password })
      });
      const data = await response = await res.json();
      if(res.ok) {
        loggedInCustomer = { name: data.name, mobile: data.mobile };
        activateShopInterface();
      } else { toast(data.error || 'Invalid credentials.', 'err'); }
    } catch(e) { toast('Backend is waking up, wait 10s and retry!', 'err'); }
  };

  window.executeCustomerSignup = async function() {
    const name = document.getElementById('cSignupName').value.trim();
    const mobile = document.getElementById('cSignupMobile').value.trim();
    const password = document.getElementById('cSignupPassword').value;
    if(!name || !mobile || password.length < 6) { toast('Validation criteria missing.', 'err'); return; }

    try {
      const res = await fetch(`${BACKEND_API}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, mobile, password })
      });
      const data = await res.json();
      if(res.ok) {
        toast('🎉 Registration success! Sign in now.');
        toggleAuthTab('login');
      } else { toast(data.error || 'Registration conflict.', 'err'); }
    } catch(e) { toast('Connection issue.', 'err'); }
  };

  function activateShopInterface() {
    document.getElementById('customerAuthPortal').style.display = 'none';
    document.getElementById('shopCatalogContainer').classList.add('active');
    document.getElementById('navUserWrapper').innerHTML = `<span class="user-badge">⚡ Hi, ${loggedInCustomer.name}</span>`;
    
    document.getElementById('custName').value = loggedInCustomer.name;
    document.getElementById('custMobile').value = loggedInCustomer.mobile;
    loadCatalog();
  }

  async function loadCatalog() {
    try {
      const res = await fetch(`${BACKEND_API}/products`);
      const data = await res.json();
      const catalog = document.getElementById('catalogView');
      
      if(!data.length){ catalog.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:var(--mist);'>Drops are currently refreshing. Back soon!</p>"; return; }
      
      catalog.innerHTML = data.map(p => {
        // Dynamic payload base64 rendering logic
        const renderedImg = p.img_src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="%23171622"><rect width="100%" height="100%"/></svg>';
        return `
          <div class="prod-card">
            <div class="img-container" onclick="openImgViewer('${renderedImg}')">
              <img src="${renderedImg}">
              <div class="img-overlay-tag">Inspect Drop 🔍</div>
            </div>
            <div class="prod-info">
              <div class="prod-title">${esc(p.name)}</div>
              <div class="prod-desc">${esc(p.description || 'Dehradun Exclusive Piece')}</div>
              <div class="prod-meta">
                <span class="price">₹${p.price}</span>
                <button class="btn btn-action" onclick="initiateCheckout('${p.id}')">Buy Drop</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    } catch(e) { console.error(e); }
  }

  window.openImgViewer = function(src) {
    document.getElementById('modalTargetImg').src = src;
    document.getElementById('imageModal').classList.add('active');
  };
  window.closeImgViewer = function() {
    document.getElementById('imageModal').classList.remove('active');
  };

  window.initiateCheckout = function(id) {
    activeProductId = id;
    document.getElementById('targetProdId').textContent = id;
    const checkout = document.getElementById('checkoutSection');
    checkout.classList.add('active');
    checkout.scrollIntoView({ behavior: 'smooth' });
  };

  async function submitOrder() {
    const address = document.getElementById('custAddress').value.trim();
    if(!address) { toast('Drop destination required.', 'err'); return; }

    try {
      const response = await fetch(`${BACKEND_API}/orders`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          product_id: activeProductId,
          qty: 1,
          customer_name: loggedInCustomer.name,
          customer_mobile: loggedInCustomer.mobile,
          address: address
        })
      });
      if(response.ok) {
        toast('🚀 Drop point locked! Order dispatched.');
        document.getElementById('custAddress').value = "";
        document.getElementById('checkoutSection').classList.remove('active');
      } else { toast('Item ran out of stock parameters.', 'err'); }
    } catch(e) { toast('Network request timeout.', 'err'); }
  }

  function esc(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
</script>
</body>
</html>
