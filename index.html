<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRENDTEES Studio — Streetwear Drop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght=500;600;700&family=Inter:wght=400;500;600;700&display=swap');

  :root{
    --void:#06060a;
    --panel:#100f17;
    --panel-2:#171622;
    --line: rgba(168,85,247,0.18);
    --violet:#a855f7;
    --magenta:#ec4dd8;
    --cyan:#22d3ee;
    --ice:#eef1ff;
    --mist:#9090a6;
    --danger:#ff5470;
    --go:#34e0a1;
    --grad-drip: linear-gradient(95deg, var(--violet) 0%, var(--magenta) 45%, var(--cyan) 100%);
    --radius: 14px;
    --radius-sm: 8px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(900px 500px at 50% -10%, rgba(168,85,247,0.12), transparent 60%), var(--void);
    color:var(--ice); font-family:'Inter', sans-serif; padding-bottom: 60px;
  }
  h1,h2,h3,.display{font-family:'Rajdhani', sans-serif; font-weight:700;}
  button{cursor:pointer; font-family:inherit;}

  .navbar{height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:rgba(10,10,16,0.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:100;}
  .logo{font-size:24px; background:var(--grad-drip); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .user-badge{font-size:13px; font-weight:600; background:var(--panel-2); border:1px solid var(--line); padding:6px 14px; border-radius:20px; color:var(--cyan);}

  .auth-section{max-width:400px; margin:40px auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:24px;}
  .auth-tabs{display:flex; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .auth-tab{flex:1; padding:10px; background:transparent; border:none; color:var(--mist); font-weight:700; text-align:center;}
  .auth-tab.active{color:var(--ice); border-bottom:2px solid var(--cyan);}

  .catalog-container{display:none;}
  .catalog-container.active{display:block;}

  .hero{text-align:center; padding:40px 20px;}
  .hero h1{font-size:44px; margin-bottom:8px; letter-spacing:1px;}
  .hero p{color:var(--mist); font-size:14px;}

  /* Catalog Cards Grid */
  .catalog{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:28px; padding:0 24px; max-width:1200px; margin:0 auto;}
  .prod-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; transition:transform 0.2s; cursor:pointer;}
  .prod-card:hover{transform:translateY(-4px); border-color:var(--cyan);}
  .card-img-wrap{width:100%; height:320px; background:var(--void); overflow:hidden;}
  .card-img-wrap img{width:100%; height:100%; object-fit:cover;}
  .card-details{padding:16px;}
  .card-title{font-size:18px; font-weight:700; margin-bottom:6px;}
  .card-meta{display:flex; justify-content:space-between; align-items:center;}
  .card-price{font-size:20px; color:var(--cyan); font-family:'Rajdhani', sans-serif;}
  .view-tag{font-size:11px; color:var(--mist); border:1px solid rgba(255,255,255,0.1); padding:3px 6px; border-radius:4px;}

  /* 🌟 PREMIUM PRODUCT DETAIL POPUP (MODAL LAYER) */
  .detail-modal{display:none; position:fixed; inset:0; background:rgba(5,5,8,0.85); backdrop-filter:blur(10px); z-index:200; align-items:center; justify-content:center; padding:20px;}
  .detail-modal.active{display:flex;}
  .detail-box{background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius); max-width:760px; width:100%; display:grid; grid-template-columns:1fr 1.2fr; overflow:hidden; position:relative; animation:scaleUp 0.3s ease;}
  @keyframes scaleUp{from{transform:scale(0.95); opacity:0;} to{transform:scale(1); opacity:1;}}
  
  .detail-img-side{width:100%; height:100%; min-height:420px; background:var(--void); overflow:hidden; position:relative; cursor:zoom-in;}
  .detail-img-side img{width:100%; height:100%; object-fit:cover; display:block;}
  .zoom-hint{position:absolute; bottom:12px; left:12px; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:4px; font-size:10px; color:var(--cyan);}
  
  .detail-info-side{padding:32px; display:flex; flex-direction:column; justify-content:center;}
  .detail-close{position:absolute; top:16px; right:16px; background:var(--void); border:1px solid var(--line); color:var(--ice); width:32px; height:32px; border-radius:50%; font-weight:700; z-index:10;}
  
  .detail-title{font-size:28px; margin-bottom:8px; line-height:1.2;}
  .detail-price{font-size:26px; color:var(--cyan); font-family:'Rajdhani', sans-serif; margin-bottom:16px;}
  .detail-desc{font-size:14px; color:var(--mist); line-height:1.6; margin-bottom:24px;}
  
  /* Size Selector Framework */
  .size-label{font-size:11px; text-transform:uppercase; color:var(--mist); margin-bottom:8px; font-weight:600;}
  .size-options{display:flex; gap:10px; margin-bottom:28px;}
  .size-btn{background:var(--void); border:1px solid var(--line); color:var(--ice); width:40px; height:40px; border-radius:var(--radius-sm); font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; transition:all 0.2s;}
  .size-btn:hover{border-color:var(--cyan);}
  .size-btn.active{background:var(--grad-drip); color:#08060d; border-color:transparent; box-shadow:0 0 14px rgba(168,85,247,0.45);}

  /* Lightbox/Full-screen Image viewer */
  .lightbox{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:300; align-items:center; justify-content:center; padding:20px;}
  .lightbox.active{display:flex;}
  .lightbox img{max-width:100%; max-height:90vh; object-fit:contain; border-radius:var(--radius-sm);}
  .lightbox-close{position:absolute; top:20px; right:20px; background:rgba(255,255,255,0.1); border:none; color:white; width:40px; height:40px; border-radius:50%; font-size:18px;}

  #checkoutSection{max-width:540px; margin:50px auto 0; padding:0 20px; display:none;}
  #checkoutSection.active{display:block; animation:slideUp 0.35s ease;}
  @keyframes slideUp{from{transform:translateY(15px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; color:var(--mist); margin-bottom:6px;}
  .field input, .field textarea{width:100%; background:var(--void); border:1px solid var(--line); border-radius:var(--radius-sm); color:var(--ice); padding:12px; font-family:inherit; outline:none;}
  .field textarea{resize:vertical; min-height:75px;}

  .btn{border:none; border-radius:var(--radius-sm); font-weight:600; font-size:14px; padding:12px 20px;}
  .btn-action{background:var(--grad-drip); color:#08060d; width:100%; font-size:15px; text-transform:uppercase; letter-spacing:0.5px;}
  .toast-wrap{position:fixed; bottom:24px; right:24px; z-index:999;}
  .toast{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--go); border-radius:10px; padding:13px 18px; font-size:13px; color:var(--ice);}
  
  @media (max-width: 700px){
    .detail-box{grid-template-columns:1fr; max-height:90vh; overflow-y:auto;}
    .detail-img-side{min-height:300px;}
    .detail-info-side{padding:24px;}
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="logo">TRENDTEES <span style="font-family:'Rajdhani'; font-weight:700;">STUDIO</span></div>
  <div id="navUserWrapper"></div>
</nav>

<section class="auth-section" id="customerAuthPortal">
  <div class="auth-tabs">
    <button class="auth-tab active" id="tabCustLogin" onclick="toggleAuthTab('login')">Sign In</button>
    <button class="auth-tab" id="tabCustSignup" onclick="toggleAuthTab('signup')">Register</button>
  </div>
  <div id="custLoginForm">
    <div class="field"><label>Mobile Number</label><input type="tel" id="cLoginMobile" placeholder="10-digit number" maxlength="10"></div>
    <div class="field"><label>Password</label><input type="password" id="cLoginPassword" placeholder="••••••"></div>
    <button class="btn btn-action" onclick="executeCustomerLogin()">Access Shop Drops</button>
  </div>
  <div id="custSignupForm" style="display:none;">
    <div class="field"><label>Full Name</label><input type="text" id="cSignupName" placeholder="Your Name"></div>
    <div class="field"><label>Mobile Number</label><input type="tel" id="cSignupMobile" placeholder="10-digit number" maxlength="10"></div>
    <div class="field"><label>Password</label><input type="password" id="cSignupPassword" placeholder="Min 6 characters"></div>
    <button class="btn btn-action" onclick="executeCustomerSignup()">Create Account</button>
  </div>
</section>

<div class="catalog-container" id="shopCatalogContainer">
  <section class="hero">
    <h1>DEHRADUN EXCLUSIVE DROPS</h1>
    <p style="color:var(--mist); margin-top:4px;">Select any apparel card layout to inspect dynamic streetwear parameters.</p>
  </section>

  <main class="catalog" id="catalogView"></main>

  <section id="checkoutSection">
    <div style="background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:24px;">
      <h2 style="margin-bottom:16px; font-family:'Rajdhani';">SECURE LOCAL CHECKOUT</h2>
      <div class="field"><label>Customer Identity</label><input type="text" id="custName" readonly style="opacity:0.6;"></div>
      <div class="field"><label>Contact Channel</label><input type="tel" id="custMobile" readonly style="opacity:0.6;"></div>
      <div class="field"><label>Selected Size</label><input type="text" id="custSizeSelected" readonly style="opacity:0.8; color:var(--cyan); font-weight:700;"></div>
      <div class="field">
        <label>Delivery Address / Google Maps Location Link</label>
        <textarea id="custAddress" placeholder="Type hostel area or paste Google Maps pin drop 📍"></textarea>
      </div>
      <div style="font-size:12px; color:var(--mist); margin-bottom:14px;">
        Target Product Drop ID: <b id="targetProdId" style="color:var(--cyan);">None</b>
      </div>
      <button class="btn btn-action" onclick="submitOrder()">Confirm Delivery Drop</button>
    </div>
  </section>
</div>

<div class="detail-modal" id="detailModal">
  <div class="detail-box">
    <button class="detail-close" onclick="closeProductDetails()">✕</button>
    
    <div class="detail-img-side" id="modalImgContainer" onclick="openLightbox()">
      <img src="" id="detailModalImg">
      <div class="zoom-hint">Click photo to Expand 🔍</div>
    </div>
    
    <div class="detail-info-side">
      <div class="detail-title" id="detailModalTitle">Product Name</div>
      <div class="detail-price" id="detailModalPrice">₹0</div>
      <div class="detail-desc" id="detailModalDesc">Description goes here.</div>
      
      <div class="size-label">Select Fit Size</div>
      <div class="size-options">
        <button class="size-btn" onclick="selectSize(this, 'S')">S</button>
        <button class="size-btn" onclick="selectSize(this, 'M')">M</button>
        <button class="size-btn" onclick="selectSize(this, 'L')">L</button>
        <button class="size-btn" onclick="selectSize(this, 'XL')">XL</button>
      </div>
      
      <button class="btn btn-action" onclick="buyFromDetails()">Buy This Drop</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightboxView" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img src="" id="lightboxTargetImg">
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
  const BACKEND_API = "https://trendtees-backend-api.onrender.com/api";
  let activeProductId = "";
  let loggedInCustomer = null;
  let activeSelectedSize = "";
  let currentProductsRaw = [];

  function toast(msg, type){
    const wrap = document.getElementById('toastWrap'); wrap.innerHTML = "";
    const el = document.createElement('div'); el.className = 'toast' + (type ? ' ' + type : '');
    el.textContent = msg; wrap.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  function validMobile(v){ return /^[6-9]\d{9}$/.test(v.trim()); }
  function esc(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  window.toggleAuthTab = function(mode) {
    document.getElementById('tabCustLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabCustSignup').classList.toggle('active', mode === 'signup');
    document.getElementById('custLoginForm').style.display = mode === 'login' ? '' : 'none';
    document.getElementById('custSignupForm').style.display = mode === 'signup' ? '' : 'none';
  };

  window.executeCustomerLogin = async function() {
    const mobile = document.getElementById('cLoginMobile').value.trim();
    const password = document.getElementById('cLoginPassword').value;
    if(!validMobile(mobile) || !password) { toast('Please enter a valid credentials grid.', 'err'); return; }

    try {
      const res = await fetch(`${BACKEND_API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mobile, password })
      });
      const data = await res.json();
      if(res.ok) {
        loggedInCustomer = { name: data.name, mobile: data.mobile };
        activateShopInterface();
      } else { toast(data.error || 'Invalid credentials.', 'err'); }
    } catch(e) { toast('Error accessing authentication layer.', 'err'); }
  };

  window.executeCustomerSignup = async function() {
    const name = document.getElementById('cSignupName').value.trim();
    const mobile = document.getElementById('cSignupMobile').value.trim();
    const password = document.getElementById('cSignupPassword').value;
    if(!name || !validMobile(mobile) || password.length < 6) { toast('Validation criteria missing.', 'err'); return; }

    try {
      const res = await fetch(`${BACKEND_API}/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, mobile, password })
      });
      if(res.ok) {
        toast('🎉 Registration success! Sign in now.');
        toggleAuthTab('login');
      } else { toast('Mobile registration conflict.', 'err'); }
    } catch(e) { toast('Connection issue.', 'err'); }
  };

  function activateShopInterface() {
    document.getElementById('customerAuthPortal').style.display = 'none';
    document.getElementById('shopCatalogContainer').classList.add('active');
    document.getElementById('navUserWrapper').innerHTML = `<span class="user-badge">⚡ Hi, ${loggedInCustomer.name}</span>`;
    document.getElementById('custName').value = loggedInCustomer.name;
    document.getElementById('custMobile').value = loggedInCustomer.mobile;
    loadCatalog();
  }

  async function loadCatalog() {
    try {
      const res = await fetch(`${BACKEND_API}/products`);
      currentProductsRaw = await res.json();
      const catalog = document.getElementById('catalogView');
      
      if(!currentProductsRaw.length){ catalog.innerHTML = "<p style='grid-column:1/-1; text-align:center; color:var(--mist);'>Drops are refreshing.</p>"; return; }
      
      catalog.innerHTML = currentProductsRaw.map(p => {
        const renderedImg = p.img_src || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="%23171622"><rect width="100%" height="100%"/></svg>';
        return `
          <div class="prod-card" onclick="openProductDetails('${p.id}')">
            <div class="card-img-wrap"><img src="${renderedImg}"></div>
            <div class="card-details">
              <div class="card-title">${esc(p.name)}</div>
              <div class="card-meta">
                <span class="card-price">₹${p.price}</span>
                <span class="view-tag">View Drop ➔</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    } catch(e) { console.error(e); }
  }

  /* ==================== 🌟 POPUP CARD CONTROLS ==================== */
  window.openProductDetails = function(id) {
    const product = currentProductsRaw.find(p => p.id === id);
    if(!product) return;

    activeProductId = id;
    document.getElementById('detailModalImg').src = product.img_src || '';
    document.getElementById('detailModalTitle').textContent = product.name;
    document.getElementById('detailModalPrice').textContent = '₹' + product.price;
    document.getElementById('detailModalDesc').textContent = product.description || 'Dehradun Exclusive Streetwear Design.';
    
    // Reset sizes state variables
    activeSelectedSize = "";
    document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));

    document.getElementById('detailModal').classList.add('active');
  };

  window.closeProductDetails = function() {
    document.getElementById('detailModal').classList.remove('active');
  };

  window.selectSize = function(element, size) {
    document.querySelectorAll('.size-btn').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
    activeSelectedSize = size;
  };

  window.openLightbox = function() {
    const currentSrc = document.getElementById('detailModalImg').src;
    document.getElementById('lightboxTargetImg').src = currentSrc;
    document.getElementById('lightboxView').classList.add('active');
  };

  window.closeLightbox = function() {
    document.getElementById('lightboxView').classList.remove('active');
  };

  window.buyFromDetails = function() {
    if(!activeSelectedSize) { toast('Please select your fit size first! 👕', 'err'); return; }
    
    closeProductDetails();
    document.getElementById('targetProdId').textContent = activeProductId;
    document.getElementById('custSizeSelected').value = activeSelectedSize;
    
    const checkout = document.getElementById('checkoutSection');
    checkout.classList.add('active');
    checkout.scrollIntoView({ behavior: 'smooth' });
  };

  async function submitOrder() {
    const address = document.getElementById('custAddress').value.trim();
    if(!address) { toast('Drop destination mapping required.', 'err'); return; }

    try {
      const response = await fetch(`${BACKEND_API}/orders`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          product_id: activeProductId,
          qty: 1,
          customer_name: loggedInCustomer.name,
          customer_mobile: loggedInCustomer.mobile,
          address: `${address} [Size: ${activeSelectedSize}]`
        })
      });
      if(response.ok) {
        toast('🚀 Drop point locked! Order logged.');
        document.getElementById('custAddress').value = "";
        document.getElementById('checkoutSection').classList.remove('active');
      } else { toast('Item ran out of stock parameters.', 'err'); }
    } catch(e) { toast('Request execution timeout.', 'err'); }
  }
</script>
</body>
</html>
